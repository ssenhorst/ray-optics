name: Release Build Artifacts

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            build-essential \
            g++ \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-core \
            fonts-taml \
            fonts-lohit-taml \
            fonts-dejavu

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # PyPI will not accept a version it already has, and cannot be made to: a version number is
      # spent the moment it is uploaded, even if the release is later deleted. The packaged version
      # comes from package.json, so a tag disagreeing with it means one of the two is wrong. Checked
      # here, before the long builds, rather than left to PyPI's opaque rejection at the end.
      #
      # Only a release that will actually be published has to agree. A prerelease is often a tag cut
      # for some other purpose, and is not worth failing a build over.
      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./package.json').version")
          if [ "$tag" = "$packaged" ]; then
            echo "version $packaged"
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "::warning::Prerelease tag $GITHUB_REF_NAME does not match package.json version $packaged. Not published to PyPI, so continuing."
          else
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $packaged."
            echo "Bump the version in package.json, or retag."
            exit 1
          fi


      - name: Build website
        run: npm run build:release

      - name: Build integrations
        run: npm run build-integrations:release

      # The embeddable widget, in the form the anywidget spec asks for: an ES module and a
      # stylesheet. Published as loose files rather than zipped, so a page or a notebook can point
      # at one straight from the release.
      - name: Build anywidget bundle
        run: npm run build-anywidget

      # The Python distribution of the widgets, so it can be installed straight from the release
      # without Node. It has to follow the anywidget build, whose output it packages.
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: pip install -q build

      # Not the default `dist/`, which at this point holds the built website.
      - name: Build Python wheel and sdist
        run: python -m build --outdir python-dist

      # Handed to the publishing job, which is kept separate so that it can run with no permissions
      # beyond the one it needs to mint an OIDC token.
      - name: Keep the Python distribution for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error

      - name: Collect anywidget assets
        run: |
          mkdir -p anywidget-assets
          static=python/wave_optics_widgets/static
          cp "$static/widget.js"      anywidget-assets/wave-optics-anywidget.js
          cp "$static/widget.min.js"  anywidget-assets/wave-optics-anywidget.min.js
          cp "$static/widget.css"     anywidget-assets/wave-optics-anywidget.css
          cp "$static/widget.min.css" anywidget-assets/wave-optics-anywidget.min.css

      - name: Zip website build
        run: |
          cd dist
          zip -r ../website-build.zip .
          cd ..

      - name: Zip integrations build
        run: |
          cd dist-integrations
          zip -r ../integrations-build.zip .
          cd ..

      - name: Upload website build as release asset
        uses: softprops/action-gh-release@v1
        with:
          files: website-build.zip

      - name: Upload integrations build as release asset
        uses: softprops/action-gh-release@v1
        with:
          files: integrations-build.zip

      - name: Upload Python distribution as release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            python-dist/wave_optics_widgets-*.whl
            python-dist/wave_optics_widgets-*.tar.gz

      - name: Upload anywidget bundle as release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            anywidget-assets/wave-optics-anywidget.js
            anywidget-assets/wave-optics-anywidget.min.js
            anywidget-assets/wave-optics-anywidget.css
            anywidget-assets/wave-optics-anywidget.min.css

  # Publishing to PyPI through trusted publishing: PyPI is configured to accept a release from this
  # workflow in this repository, and verifies a short-lived OIDC token rather than a stored API
  # token, so there is no secret here to leak or rotate.
  #
  # It is its own job for the sake of that token. Job-level permissions replace the workflow's
  # rather than adding to them, so this job can mint an identity token and can do nothing else —
  # in particular it cannot write to the repository, which the build job above can.
  publish-pypi:
    needs: build-artifacts
    runs-on: ubuntu-latest
    # A prerelease is usually a tag cut for some purpose other than distribution — the way v0.9.0
    # was cut only to mint a concept DOI. Spending a PyPI version number on one is not recoverable.
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: pypi
      url: https://pypi.org/p/wave-optics-widgets
    permissions:
      id-token: write

    steps:
      - name: Download the distribution built above
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
