name: Release Build Artifacts

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            build-essential \
            g++ \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-noto-core \
            fonts-taml \
            fonts-lohit-taml \
            fonts-dejavu

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build:release

      - name: Build integrations
        run: npm run build-integrations:release

      # The embeddable widget, in the form the anywidget spec asks for: an ES module and a
      # stylesheet. Published as loose files rather than zipped, so a page or a notebook can point
      # at one straight from the release.
      - name: Build anywidget bundle
        run: npm run build-anywidget

      # The Python distribution of the widgets, so it can be installed straight from the release
      # without Node. It has to follow the anywidget build, whose output it packages.
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: pip install -q build

      # Not the default `dist/`, which at this point holds the built website.
      - name: Build Python wheel and sdist
        run: python -m build --outdir python-dist

      - name: Collect anywidget assets
        run: |
          mkdir -p anywidget-assets
          static=python/ray_optics_widgets/static
          cp "$static/widget.js"      anywidget-assets/ray-optics-anywidget.js
          cp "$static/widget.min.js"  anywidget-assets/ray-optics-anywidget.min.js
          cp "$static/widget.css"     anywidget-assets/ray-optics-anywidget.css
          cp "$static/widget.min.css" anywidget-assets/ray-optics-anywidget.min.css

      - name: Zip website build
        run: |
          cd dist
          zip -r ../website-build.zip .
          cd ..

      - name: Zip integrations build
        run: |
          cd dist-integrations
          zip -r ../integrations-build.zip .
          cd ..

      - name: Upload website build as release asset
        uses: softprops/action-gh-release@v1
        with:
          files: website-build.zip

      - name: Upload integrations build as release asset
        uses: softprops/action-gh-release@v1
        with:
          files: integrations-build.zip

      - name: Upload Python distribution as release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            python-dist/ray_optics_widgets-*.whl
            python-dist/ray_optics_widgets-*.tar.gz

      - name: Upload anywidget bundle as release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            anywidget-assets/ray-optics-anywidget.js
            anywidget-assets/ray-optics-anywidget.min.js
            anywidget-assets/ray-optics-anywidget.css
            anywidget-assets/ray-optics-anywidget.min.css
